; Example demo profile. Pick it from the "Config" dropdown in the demo header.
;
; Every ini in this directory is layered on top of demo.ini (shared UI settings),
; so a profile only has to declare the maps and policies it wants to offer.
;
; Copy this file to make your own profile — e.g. `my_demo.ini`. Anything you add
; here that is not tracked by git (see the demo/config entries in .gitignore) stays
; local to your machine.

; Maps offered in the header's "Map" dropdown: <label> = <path to a map binary>.
; Relative paths are resolved against this directory and its parents first, then
; against $DRIVE_BINARIES_DATA_ROOT — so the entries below work both with the
; bundled resources symlink and with an external binaries folder.
[demo.maps]
map_0 = resources/drive/binaries/training/map_000000.bin
map_1 = resources/drive/binaries/training/map_000001.bin
map_2 = resources/drive/binaries/training/map_000002.bin

; Policies offered in the sidebar's policy dropdowns. One [policies.<key>] section
; each, where `model` is a .pt checkpoint and `config` the drive ini describing the
; architecture (policy/rnn sizes, dynamics model) that checkpoint was trained with.
[policies.pretrained]
name = Pretrained
config = config/ocean/drive.ini
model = resources/drive/model_puffer_drive_003815.pt
